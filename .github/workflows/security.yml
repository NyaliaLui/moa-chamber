name: Security Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vulnerable-app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./tests/security/vulnerable.Dockerfile
          tags: vulnerable-app:latest
          load: true

      - name: Build protected-app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./tests/security/protected.Dockerfile
          tags: protected-app:latest
          load: true

      - name: Verify images
        run: docker images | grep -E "(vulnerable|protected)-app"

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm test -- react2shell
